<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoMail — banque de courriers</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6bff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='4' width='20' height='16' rx='3'/><path d='m3 6 9 7 9-7'/></svg>">
</head>
<body>
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="3.5" stroke="currentColor" stroke-width="1.7"/>
        <path d="m3.5 7 8.5 6.2L20.5 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="18.5" cy="6.5" r="3" fill="var(--accent)" stroke="var(--card)" stroke-width="1.4"/>
      </svg>
      <span class="word">AutoMail</span>
    </div>
    <nav class="mainnav">
      <button type="button" data-nav="mail" class="on">Courriers</button>
      <button type="button" data-nav="dash">Tableau de bord</button>
    </nav>
    <div class="head-right">
      <div id="stats" class="stats"></div>
      <select id="skin" class="skinsel" title="Direction visuelle (essai)">
        <option value="night">Nuit</option>
        <option value="paper">Papier</option>
        <option value="corporate">Corporate</option>
      </select>
      <button id="update" type="button" class="pill" title="Mettre à jour depuis GitHub">
        <svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Mise à jour</span>
      </button>
      <button id="theme" type="button" class="icon" title="Thème clair / sombre" aria-label="Thème"></button>
    </div>
  </header>

  <!-- ================= COURRIERS ================= -->
  <section id="view-mail">
    <div class="toolbar">
      <div class="searchbox">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="q" placeholder="Rechercher dans le texte des courriers…" autocomplete="off">
      </div>
      <label class="fld">du <input type="date" id="date_from"></label>
      <label class="fld">au <input type="date" id="date_to"></label>
      <label class="fld">OCR
        <select id="ocrstatus" title="État de l'OCR">
          <option value="all">tous</option>
          <option value="ok" selected>traités</option>
          <option value="pending">en attente</option>
          <option value="processing">en cours</option>
          <option value="failed">échecs</option>
        </select>
      </label>
      <span class="fld">Suivi</span>
      <div class="progseg" id="progseg" role="group" aria-label="Avancement">
        <button type="button" data-pf="" class="on">Tous</button>
        <button type="button" data-pf="todo" class="p-todo">À faire</button>
        <button type="button" data-pf="ongoing" class="p-ongoing">En cours</button>
        <button type="button" data-pf="done" class="p-done">Fait</button>
      </div>
      <select id="sort" title="Tri">
        <option value="date">Date du courrier (récent → ancien)</option>
        <option value="date_asc">Date du courrier (ancien → récent)</option>
        <option value="added">Date d'import (récent → ancien)</option>
        <option value="added_asc">Date d'import (ancien → récent)</option>
        <option value="pertinence">Pertinence</option>
      </select>
      <label class="fld chk" title="Uniquement les courriers dont l'OCR n'a pas trouvé de date">
        <input type="checkbox" id="nodate"> sans date détectée
      </label>
      <button id="go" type="button" class="primary">Rechercher</button>
      <button id="reset" type="button" class="ghost">Réinitialiser</button>

      <span class="tb-spacer"></span>

      <button id="trash-toggle" type="button" class="icon" title="Corbeille">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
      <div class="seg" id="viewseg" role="group" aria-label="Affichage">
        <button type="button" data-view="list" title="Liste"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        <button type="button" data-view="detail" class="on" title="Détail"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg></button>
        <button type="button" data-view="tiles" title="Tuiles"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      </div>
      <button id="select-toggle" type="button" class="ghost">Sélectionner</button>
    </div>

    <main id="results" class="view-detail"></main>

    <nav id="pager" class="pager" hidden>
      <button id="prev" type="button">‹</button>
      <span id="pageinfo"></span>
      <button id="next" type="button">›</button>
      <label class="perpage">par page
        <select id="page_size">
          <option>25</option><option selected>50</option><option>100</option><option>200</option>
        </select>
      </label>
    </nav>
  </section>

  <!-- ================= TABLEAU DE BORD ================= -->
  <section id="view-dash" hidden>
    <div id="dash"></div>
  </section>

  <!-- barre de sélection multiple -->
  <div id="selbar" class="selbar" hidden>
    <label class="selall"><input type="checkbox" id="sel-all"> Toute la page</label>
    <strong id="sel-count">0 sélectionné</strong>
    <span class="spacer"></span>
    <span id="sel-actions"></span>
    <button id="select-done" type="button" class="primary">Terminer</button>
  </div>

  <dialog id="preview">
    <div class="modal-head">
      <strong id="preview-title">Aperçu</strong>
      <span>
        <a id="preview-dl" class="btn" download>Télécharger l'original</a>
        <button type="button" data-close>Fermer</button>
      </span>
    </div>
    <iframe id="preview-frame" title="Aperçu du courrier"></iframe>
  </dialog>

  <dialog id="editor">
    <form method="dialog" id="editform">
      <h2>Modifier le courrier</h2>
      <dl id="e-info" class="info"></dl>
      <label>Titre <input type="text" id="e-title"></label>
      <label>Date du courrier <input type="date" id="e-date"></label>
      <label>Avancement
        <select id="e-progress">
          <option value="todo">À faire</option>
          <option value="ongoing">En cours</option>
          <option value="done">Fait</option>
        </select>
      </label>
      <label>Notes <textarea id="e-notes" rows="2"></textarea></label>
      <div class="reocr">
        <span>Relancer l'OCR&nbsp;:</span>
        <button type="button" data-lang="fra">Français</button>
        <button type="button" data-lang="deu">Allemand</button>
        <button type="button" data-lang="ara">Arabe</button>
        <button type="button" data-lang="fra+deu">FR + DE</button>
      </div>
      <div class="modal-actions">
        <button type="button" id="e-delete" class="danger">Supprimer</button>
        <span class="spacer"></span>
        <button type="button" data-close>Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="updater">
    <div class="modal-head">
      <strong>Mise à jour depuis GitHub</strong>
      <button type="button" data-close>Fermer</button>
    </div>
    <div class="upd-body">
      <p id="upd-current" class="muted"></p>
      <pre id="upd-log" class="console" hidden></pre>
      <div class="modal-actions">
        <button type="button" id="upd-run" class="primary">Lancer la mise à jour</button>
        <button type="button" id="upd-restart" class="primary" hidden>Redémarrer les services</button>
        <button type="button" id="upd-reload" class="primary" hidden>Recharger la page</button>
        <span class="spacer"></span>
        <span id="upd-state" class="muted"></span>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>

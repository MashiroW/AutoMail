# Banque de courriers OCR — worker + web dans deux conteneurs partageant ./data
#
#   mkdir -p data/inbox
#   docker compose up -d --build
#
# Interface : http://<ip-du-pi>:8080/
# Dépôt des scans : ./data/inbox  (voir README pour surveiller un autre dossier)

services:
  worker:
    build: .
    image: courriers-ocr
    command: python -m courriers_ocr.worker
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      COURRIERS_DATA_DIR: /data
      COURRIERS_OCR_LANGUAGES: "${COURRIERS_OCR_LANGUAGES:-fra}"
      COURRIERS_POLL_INTERVAL_SECONDS: "${COURRIERS_POLL_INTERVAL_SECONDS:-10}"
      COURRIERS_STABLE_CHECKS: "${COURRIERS_STABLE_CHECKS:-2}"
    volumes:
      - ./data:/data
      # code monté en direct : `git pull` + `docker compose restart` suffit,
      # pas besoin de reconstruire l'image pour un changement de code
      - ./courriers_ocr:/app/courriers_ocr:ro
      - ./web:/app/web:ro

  web:
    build: .
    image: courriers-ocr
    command: uvicorn courriers_ocr.app:app --host 0.0.0.0 --port 8080
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      COURRIERS_DATA_DIR: /data
      COURRIERS_API_TOKEN: "${COURRIERS_API_TOKEN:-}"
    volumes:
      - ./data:/data
      - ./courriers_ocr:/app/courriers_ocr:ro
      - ./web:/app/web:ro
    ports:
      - "${COURRIERS_PORT:-8080}:8080"
    depends_on:
      - worker
